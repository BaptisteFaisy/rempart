# File de merge Mergify — socle CI (budget 5 min) + checks réels Rempart.
#
# Les `queue_conditions` exigent les 4 checks de la CI du dépôt :
#   - ci-budget : garde-fou « chaque job ≤ 5 minutes » (règle user 2026-10-24)
#   - backend   : pytest + ruff du backend (rempart.common/api/orchestrator/triage/reports)
#   - portal    : build + vitest du portail React
#   - demo      : pytest des applications de démonstration
# Le check `iac` (synth CDK + template client) est ajouté quand le dépôt
# gagne des stacks CDK : il est déjà dans la CI, voir .github/workflows/ci-iac.yml.
queue_rules:
  - name: default
    queue_conditions:
      - check-success = ci-budget
      - check-success = backend
      - check-success = portal
      - check-success = demo
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "10 seconds"
    max_checks_retries: 1
    checks_timeout: 5 min
    # Squash, pas rebase (décision user 2026-11-08) : une PR = un commit
    # sur main, et une PR ayant fusionné main en elle reste fusionnable.
    merge_method: squash
    # Mise à jour par merge de main : jamais de réécriture (force-push).
    update_method: merge
    commit_message_format:
      title: pr-title
      body: pr-body

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  max_parallel_checks: 4

# File automatique : toute PR prête entre seule dans la file, sans geste
# manuel. Le label `hold` est la sortie de secours.
pull_request_rules:
  - name: file automatique des PR prêtes
    conditions:
      - check-success = ci-budget
      - check-success = stale-base-guard
      - -closed
      - -draft
      - -conflict
      - -label = hold
      - base = main
    actions:
      queue:

merge_protections_settings:
  auto_merge_conditions: true
