# File de merge Mergify — socle CI
queue_rules:
  - name: default
    queue_conditions:
      # Budget CI 5 min (règle user 2026-10-24) : le garde-fou du socle.
      - check-success = ci-budget
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "30 seconds"
    max_checks_retries: 1
    merge_method: squash
    update_method: merge
    commit_message_format:
      title: pr-title
      body: pr-body

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  max_parallel_checks: 4

pull_request_rules:
  - name: file automatique des PR prêtes
    conditions:
      - check-success = ci-budget
      - check-success = stale-base-guard
      - -closed
      - -draft
      - -conflict
      - -label = hold
      - base = main
    actions:
      queue:

merge_protections_settings:
  auto_merge_conditions: true
