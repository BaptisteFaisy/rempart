name: Hermes Lite (gate)

# [HERMES-REFRESH] Gate « fraîcheur exigée au merge ».
# La logique complète vit dans .github/hermes/gate.py (stdlib seule).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Numéro de PR spécifique (vide = toutes les PR ouvertes)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: hermes-lite-${{ github.repository }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.HERMES_LITE_TOKEN || github.token }}
  # Contexts de statut requis avant merge, séparés par des virgules.
  HERMES_REQUIRED_CHECKS: 'ci-budget'
  # Alignés sur .mergify.yml (squash + mise à jour par merge), lus par gate.py.
  MERGE_METHOD: squash
  UPDATE_METHOD: merge

jobs:
  gate:
    name: Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Gate
        run: |
          export INPUT_PR_NUMBER="${{ github.event.inputs.pr_number }}"
          export HERMES_LITE_DRY_RUN="${{ vars.HERMES_LITE_DRY_RUN || '1' }}"
          python3 .github/hermes/gate.py
