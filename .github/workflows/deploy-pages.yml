name: deploy-pages (portail public)

# Publie le portail sur GitHub Pages : https://tradoooo.github.io/rempart/
#
# Le site est servi en MODE DÉMO HORS LIGNE (VITE_USE_MOCKS=1) : les données
# viennent du jeu figé `demo/seed/demo-dataset.json`, le même que celui servi
# par `scripts/serve_local.py`. Aucun backend, aucun compte AWS, aucun coût —
# et surtout aucune donnée client réelle exposée sur une URL publique.
#
# Une bannière « OFFLINE DEMO MODE » est affichée par le portail pour qu'un
# visiteur ne croie jamais voir des données réelles.
#
# Budget CI : 5 minutes (règle user 2026-10-24).

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "demo/seed/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  # `contents: write` est requis pour pousser l'artefact sur la branche gh-pages.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-portal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests (vitest)
        run: npx vitest run

      - name: Build statique (mode démo hors ligne, base /rempart/)
        env:
          VITE_USE_MOCKS: "1"
          VITE_BASE_PATH: "/rempart/"
        run: npm run build

      - name: Copie index.html -> 404.html (routage SPA sur Pages)
        # GitHub Pages ne sait pas servir une SPA : un rafraîchissement sur
        # /rempart/triage renvoie un code 404 MAIS sert 404.html, donc le
        # routeur React démarre et affiche la bonne page. Sans cette copie,
        # l'utilisateur verrait la page d'erreur de GitHub.
        run: cp dist/index.html dist/404.html

      # Publication sur la branche `gh-pages` (source Pages configurée en
      # `legacy`). On n'utilise PAS actions/deploy-pages : il exige
      # build_type=workflow, et les runners GitHub étaient en file d'attente
      # >10 min lors de la première publication — pousser l'artefact built est
      # immédiat et ne dépend d'aucun runner tiers.
      - name: Publier sur la branche gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          WORK="$(mktemp -d)"
          git clone -q --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$WORK/site" \
            || { git init -q -b gh-pages "$WORK/site"; }
          find "$WORK/site" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r dist/. "$WORK/site/"
          cd "$WORK/site"
          git add -A
          if git diff --cached --quiet; then
            echo "aucun changement à publier"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy: portail Rempart ${GITHUB_SHA::7}"
          git push -q origin gh-pages
          echo "publié sur gh-pages (${GITHUB_SHA::7})"
