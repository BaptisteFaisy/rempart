name: ci-portal (build + vitest)

# Build du portail React/TypeScript et tests vitest. Le cache npm garde la
# CI sous 5 minutes (règle user 2026-10-24).

on:
# Pas de filtre `paths:` sur pull_request : la file Mergify exige les
# checks `backend`, `portal`, `demo` sur CHAQUE PR (un filtre les rendrait
# absents sur une PR de doc, et la PR ne pourrait jamais fusionner).
# Les filtres `paths:` restent sur les push vers main.
  pull_request:
  push:
    branches: [main]
    paths:
      - "portal/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-portal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: portal (build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Checkout (superficiel)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests (vitest)
        run: npx vitest run

      - name: Build (tsc + vite)
        run: npm run build
