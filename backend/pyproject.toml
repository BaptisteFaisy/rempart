[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Gabarits de rapport : le HTML/CSS et les libelles PDF sont des litteraux
# sur une seule ligne ; les couper cassait le rendu (longueur de ligne
# non fonctionnelle ici).
"rempart/reports/monthly.py" = ["E501"]
"rempart/reports/html_renderer.py" = ["E501"]
"rempart/reports/pdf_renderer.py" = ["E501"]
"rempart/reports/summary.py" = ["E501"]
"rempart/reports/evidence.py" = ["E501"]
